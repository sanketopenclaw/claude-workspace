<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="hud.css">
<title>Race Engineer HUD</title>
</head>
<body>
<div class="hud">
  <div class="hud-row hud-row-main">
    <span class="hud-delta" id="hudDelta">--.---</span>
    <span class="hud-pos" id="hudPos">P--</span>
  </div>
  <div class="hud-row">
    <span class="hud-gap hud-gap-ahead" id="hudGapAhead">--.---</span>
    <span class="hud-gap hud-gap-behind" id="hudGapBehind">--.---</span>
  </div>
  <div class="hud-row hud-row-small">
    <span id="hudFuel">--kg</span>
    <span id="hudTyres">--/--/--/--</span>
  </div>
</div>
<script src="hud.js"></script>
</body>
</html>
